<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Jaan ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      radial-gradient(circle at top left,#ff4f81 0%,transparent 30%),
      radial-gradient(circle at bottom right,#ff99bb 0%,transparent 30%),
      linear-gradient(135deg,#170018,#2b0030,#4b0038);

      position:relative;
    }

    /* Floating Hearts */

    .heart{
      position:absolute;
      bottom:-100px;
      color:#ff8fb1;
      animation:float 7s linear infinite;
      opacity:0.7;
      z-index:1;
    }

    @keyframes float{

      0%{
        transform:translateY(0) scale(0);
      }

      100%{
        transform:translateY(-120vh) scale(1.6);
      }

    }

    /* Card */

    .container{

      width:92%;
      max-width:420px;

      padding:45px 25px;

      text-align:center;

      border-radius:30px;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,0.1);

      box-shadow:
      0 0 35px rgba(255,79,129,0.25),
      0 20px 50px rgba(0,0,0,0.45);

      position:relative;
      z-index:5;

    }

    .emoji{
      font-size:70px;
      margin-bottom:15px;
      animation:pulse 2s infinite;
    }

    @keyframes pulse{

      0%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.12);
      }

      100%{
        transform:scale(1);
      }

    }

    h1{

      color:white;
      font-size:38px;
      line-height:1.3;
      margin-bottom:12px;

    }

    .subtitle{

      font-family:'Great Vibes',cursive;
      font-size:34px;
      color:#ffb3cf;

      margin-bottom:25px;

    }

    p{

      color:#ffe5ef;
      font-size:17px;
      line-height:1.8;

      margin-bottom:35px;

    }

    /* Buttons */

    .buttons{

      display:flex;
      justify-content:center;
      align-items:center;

      gap:15px;

      position:relative;
      height:90px;

    }

    button{

      border:none;

      padding:15px 35px;

      border-radius:50px;

      font-size:17px;
      font-weight:700;

      cursor:pointer;

      transition:0.3s ease;

    }

    .yesBtn{

      background:linear-gradient(135deg,#ff4f81,#ff8fb1);

      color:white;

      box-shadow:
      0 10px 30px rgba(255,79,129,0.45);

    }

    .yesBtn:active{

      transform:scale(0.95);

    }

    .noBtn{

      background:rgba(255,255,255,0.12);

      color:white;

      border:1px solid rgba(255,255,255,0.15);

      position:relative;

      backdrop-filter:blur(10px);

      transition:
      left 0.35s ease,
      top 0.35s ease,
      transform 0.25s ease;

    }

    /* Screens */

    .screen{

      position:fixed;
      inset:0;

      display:none;

      justify-content:center;
      align-items:center;

      flex-direction:column;

      text-align:center;

      padding:25px;

      background:
      radial-gradient(circle at top,#ff6fa5 0%,transparent 35%),
      linear-gradient(135deg,#180018,#350030,#52003d);

      z-index:999;

    }

    .screen h2{

      font-size:42px;
      color:white;

      line-height:1.4;

      margin-bottom:20px;

      animation:glow 2s infinite alternate;

    }

    @keyframes glow{

      from{
        text-shadow:0 0 10px #fff;
      }

      to{
        text-shadow:
        0 0 20px #ff9ec4,
        0 0 40px #ff4f81;
      }

    }

    .screen p{

      font-size:20px;
      color:#ffe5ef;

      margin-bottom:30px;

    }

  </style>
</head>

<body>

  <!-- Floating Hearts -->

  <div class="heart" style="left:5%; font-size:22px; animation-delay:0s;">❤️</div>
  <div class="heart" style="left:25%; font-size:30px; animation-delay:2s;">💖</div>
  <div class="heart" style="left:45%; font-size:24px; animation-delay:1s;">💕</div>
  <div class="heart" style="left:70%; font-size:34px; animation-delay:4s;">💘</div>
  <div class="heart" style="left:90%; font-size:26px; animation-delay:3s;">❤️</div>

  <!-- FIRST SCREEN -->

  <div class="container" id="screen1">

    <div class="emoji">🥺❤️</div>

    <h1>Kia Ap Meri Janu Hein?</h1>

    <div class="subtitle">
      Dil Se Puch Raha Hun 💖
    </div>

    <p>
      Ap meri duniya ho ❤️<br>
      Meri har khushi ap se hai 🥺
    </p>

    <div class="buttons">

      <button class="yesBtn" id="yes1">
        YES 💖
      </button>

      <button class="noBtn" id="no1">
        NO 😭
      </button>

    </div>

  </div>

  <!-- SECOND SCREEN -->

  <div class="screen" id="screen2">

    <h2>
      To Jee Meri Jaan ❤️
    </h2>

    <p>
      Ab aik aur important sawaal 🥺💖
    </p>

    <h2 style="font-size:34px;">
      Kia Ap Meri Janu Manu Hein?
    </h2>

    <div class="buttons">

      <button class="yesBtn" id="yes2">
        YES 💖
      </button>

      <button class="noBtn" id="no2">
        NO 😭
      </button>

    </div>

  </div>

  <!-- FINAL SCREEN -->

  <div class="screen" id="screen3">

    <h2>
      💖 Choti Nozi Wali Shazina 💖
    </h2>

    <p>
      Meri pyari si janu manu ❤️🥺
    </p>

  </div>

  <script>

    const screen1 = document.getElementById("screen1");
    const screen2 = document.getElementById("screen2");
    const screen3 = document.getElementById("screen3");

    const yes1 = document.getElementById("yes1");
    const no1 = document.getElementById("no1");

    const yes2 = document.getElementById("yes2");
    const no2 = document.getElementById("no2");

    // Function to move NO button smoothly

    function moveButton(button){

      const maxX = window.innerWidth - button.offsetWidth - 20;
      const maxY = window.innerHeight - button.offsetHeight - 20;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      button.style.position = "fixed";

      button.style.left = randomX + "px";
      button.style.top = randomY + "px";

    }

    // NO BUTTON MOVES ONLY WHEN CLICKED

    no1.addEventListener("click", function(e){

      e.preventDefault();

      moveButton(no1);

    });

    no2.addEventListener("click", function(e){

      e.preventDefault();

      moveButton(no2);

    });

    // YES BUTTONS

    yes1.addEventListener("click", function(){

      screen1.style.display = "none";
      screen2.style.display = "flex";

    });

    yes2.addEventListener("click", function(){

      screen2.style.display = "none";
      screen3.style.display = "flex";

    });

  </script>

</body>
</html>
